name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e . ruff mypy "pydantic>=2" fastapi "django>=4.2" grpcio
      - run: ruff check aggify tests
      - run: mypy aggify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        mongo: ["6.0", "7.0", "8.0"]
        exclude:
          - { python-version: "3.10", mongo: "6.0" }
          - { python-version: "3.11", mongo: "6.0" }
          - { python-version: "3.9", mongo: "8.0" }
          - { python-version: "3.10", mongo: "8.0" }
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}).ok }'"
          --health-interval 5s --health-timeout 10s --health-retries 12
        env: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - name: Install
        run: pip install -e . pytest pytest-asyncio pytest-cov hypothesis httpx "pydantic>=2" fastapi grpcio protobuf "django>=4.2"
      - name: Test
        env:
          AGGIFY_TEST_MONGO_URI: mongodb://localhost:27017/?directConnection=true
        run: pytest --cov=aggify --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.mongo == '7.0'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e . mkdocs mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict

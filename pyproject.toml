[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aggify"
version = "1.0.0.dev0"
description = "Async-first MongoDB ODM with a Django-style API: QuerySets, aggregation pipelines, FastAPI/gRPC/Django integrations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SeYeD.Dev", email = "me@seyed.dev" }]
requires-python = ">=3.9"
keywords = ["mongodb", "odm", "orm", "async", "django", "fastapi", "aggregation", "pymongo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["pymongo>=4.13,<5"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.5"]
fastapi = ["fastapi>=0.110", "pydantic>=2.5"]
grpc = ["grpcio>=1.60", "protobuf>=4.25"]
django = ["django>=4.2"]
all = ["pydantic>=2.5", "fastapi>=0.110", "grpcio>=1.60", "protobuf>=4.25", "django>=4.2"]

[project.urls]
Homepage = "https://github.com/Aggify/aggify"
Documentation = "https://aggify.github.io/aggify"
Issues = "https://github.com/Aggify/aggify/issues"

[dependency-groups]
dev = [
    "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "hypothesis>=6.100", "httpx>=0.27",
    "ruff>=0.5", "mypy>=1.10", "tox>=4.16",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["aggify"]

[tool.hatch.build.targets.sdist]
include = ["aggify", "tests", "docs", "README.md", "LICENSE", "SECURITY.md", "mkdocs.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mongo: needs a running MongoDB (set AGGIFY_TEST_MONGO_URI; auto-skipped when unreachable)",
    "replica: needs a replica set (transactions)",
]
filterwarnings = ["error::DeprecationWarning:aggify.*"]

[tool.coverage.run]
source = ["aggify"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"aggify/__init__.py" = ["F401", "F403"]
"aggify/contrib/**" = ["F401", "S"]
"tests/**" = ["F401", "F841", "S", "B", "E", "I"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "E731", "B008", "S101", "UP007", "UP006", "UP035", "UP045"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aggify.documents", "aggify.pipeline", "aggify.testing", "aggify.fields"]
disable_error_code = ["attr-defined", "assignment", "var-annotated", "arg-type", "union-attr"]
